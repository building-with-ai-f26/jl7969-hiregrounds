    <path d="M56.06 26.86 L56.98 37.12 L47.84 33.06 Z"/>
    <path d="M75.06 26.86 L75.98 37.12 L66.84 33.06 Z"/>
    <path d="M94.06 26.86 L94.98 37.12 L85.84 33.06 Z"/>
