<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hire Grounds</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Hire Grounds</span>
      </div>
      <span class="brand-tag">Coffee chat prep</span>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Walk into every coffee chat prepared.</h1>
      <p>Get an outreach email, five questions, and a tailored intro, built only from what's true about you and the person you're meeting.</p>
    </section>

    <details id="profile-section" class="panel" open>
      <summary>
        <span class="step" aria-hidden="true">1</span>
        <span class="panel-title">Your profile</span>
        <small id="profile-status" class="status">Not saved yet</small>
        <span class="chevron" aria-hidden="true"></span>
      </summary>
      <form id="profile-form">
        <label>Resume PDF
          <input type="file" id="resume-file" name="resumeFile" accept="application/pdf,.pdf">
        </label>
        <label>Or paste your resume
          <textarea id="resume-text" name="resumeText" rows="8"></textarea>
        </label>
        <label>Personal stories
          <span class="hint">Interests, background, goals, and stories you like to tell.</span>
          <textarea id="personal-stories" name="personalStories" rows="6" required></textarea>
        </label>
        <div class="actions">
          <button type="submit" id="save-profile">Save profile</button>
          <p class="message" id="profile-message" role="status"></p>
        </div>
      </form>
    </details>

    <section class="panel">
      <div class="panel-head">
        <span class="step" aria-hidden="true">2</span>
        <h2 class="panel-title">Who are you meeting?</h2>
      </div>
      <form id="contact-form">
        <div class="row">
          <label>Name <input name="name" required></label>
          <label>Role <input name="role" required></label>
          <label>Company <input name="company" required></label>
        </div>
        <label>Past experience <textarea name="pastExperience" rows="4"></textarea></label>
        <label>How you're connected <textarea name="connection" rows="2"></textarea></label>
        <label>Anything else <textarea name="notes" rows="2"></textarea></label>
        <div class="actions">
          <button type="submit" id="generate">Generate prep</button>
          <p class="message" id="generate-message" role="status"></p>
        </div>
      </form>
    </section>

    <section id="results" hidden>
      <div class="panel-head">
        <span class="step" aria-hidden="true">3</span>
        <h2 class="panel-title">Your prep</h2>
      </div>
      <div class="overlap">
        <span class="overlap-label">Overlap check</span>
        <p id="overlap"></p>
      </div>
      <div id="cards"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
